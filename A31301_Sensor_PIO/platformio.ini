[platformio]
default_envs = ballu_gen2

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
# Local build versioning is stamped by scripts/gen_version_header.py.
# Override the version with -D FW_SEMVER=\"x.y.z\" if desired.
build_flags =
  -D FW_SEMVER="2.3.3"

# Auto-generate include/Version.h before build and emit a JSON manifest after.
extra_scripts = pre:scripts/gen_version_header.py, post:scripts/gen_manifest.py

lib_deps =
  adafruit/Adafruit BusIO@^1.17.4
  adafruit/Adafruit GFX Library@^1.12.4
  adafruit/Adafruit SSD1306@^2.5.15

[env:ballu_gen2]
build_flags =
  ${env.build_flags}
  -DBOARD_GEN_2
  -DFORCE_CHG_ON_ZERO_I
  -Og
  -g3
  -fstack-protector-strong
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit INA219
